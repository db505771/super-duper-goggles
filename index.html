<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Role RNG Elite - Exact Schedule</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&display=swap');
        
        :root {
            --stealer-color: #555;
            --peasant-color: #a52a2a;
            --gifted-color: #3498db;
            --rich-color: #f1c40f;
            --wealthy-color: #e67e22;
            --king-color: #e74c3c;
            --history-color: #fff;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            background-color: #000;
            color: #fff;
            font-family: 'Inter', sans-serif;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .app-container {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            min-height: 100vh;
        }

        .forced-timer-container {
            width: 100%;
            height: 4px;
            background: #111;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 50;
        }
        #forcedProgressBar {
            height: 100%;
            width: 0%;
            background: #f1c40f;
            transition: width 1s linear;
        }

        #mainStage {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            margin-bottom: 20px;
        }
        .stage-centered { transform: translateY(60px); }
        
        .mask-vertical {
            mask-image: linear-gradient(to bottom, transparent, black 30%, black 70%, transparent);
            -webkit-mask-image: linear-gradient(to bottom, transparent, black 30%, black 70%, transparent);
        }
        .reel-container { height: 120px; width: 100%; position: relative; overflow: hidden; }
        .reel-strip { position: absolute; width: 100%; left: 0; top: 0; display: flex; flex-direction: column; }
        .reel-item { height: 120px; display: flex; align-items: center; justify-content: center; text-align: center; flex-shrink: 0; }

        .label { font-size: 10px; letter-spacing: 4px; text-transform: uppercase; opacity: 0.3; margin-bottom: 8px; }
        .text-role { font-size: clamp(2.5rem, 8vw, 4rem); font-weight: 900; letter-spacing: -2px; text-transform: uppercase; }
        .text-word { font-size: clamp(1.5rem, 6vw, 3rem); font-weight: 300; white-space: nowrap; width: 100%; overflow: hidden; text-overflow: ellipsis; }
        
        .role-peasant { color: var(--peasant-color); }
        .role-gifted { color: var(--gifted-color); }
        .role-rich { color: var(--rich-color); }
        .role-wealthy { color: var(--wealthy-color); }
        .role-king { color: var(--king-color); text-shadow: 0 0 20px rgba(231, 76, 60, 0.5); }
        .role-history { color: var(--history-color); text-shadow: 0 0 20px #fff, 0 0 40px #fff; animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }

        .panel { position: fixed; top: 0; right: 0; bottom: 0; left: 0; background: #000; z-index: 100; padding: 40px 24px; display: none; overflow-y: auto; }
        .panel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid #222; padding-bottom: 10px; }
        
        .controls { display: flex; flex-direction: column; align-items: center; gap: 10px; width: 100%; }
        
        .roll-btn-wrapper { position: relative; }
        .roll-count-badge { 
            position: absolute; 
            top: -8px; 
            right: -12px; 
            background: #e74c3c; 
            color: #fff; 
            font-size: 11px; 
            font-weight: 900; 
            padding: 4px 8px; 
            border-radius: 20px; 
            border: 2px solid #000;
            z-index: 5;
        }

        .roll-btn { background: #fff; color: #000; border: none; padding: 18px 60px; font-weight: 900; letter-spacing: 4px; text-transform: uppercase; cursor: pointer; transition: 0.2s; border-radius: 4px; position: relative; }
        .roll-btn:disabled { opacity: 0.3; cursor: not-allowed; }
        .roll-btn.auto-active { background: #e74c3c; color: #fff; }
        
        .icon-btn { background: #111; border: 1px solid #222; color: #fff; width: 56px; height: 56px; border-radius: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
        .icon-btn:hover { background: #1a1a1a; }

        .inventory-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
        .inv-card { background: #0a0a0a; padding: 15px; border-radius: 8px; border: 1px solid #1a1a1a; }

        .hidden-section { opacity: 0; pointer-events: none; }
        .countdown-container { display: flex; flex-direction: column; align-items: center; gap: 5px; min-height: 50px; }
        .timer-label { font-size: 9px; color: #444; text-transform: uppercase; margin-bottom: 2px; }
        .next-roll-timer { font-size: 10px; color: #666; }
        
        .danger-btn { background: #2a1111; color: #e74c3c; border: 1px solid #451a1a; padding: 10px; width: 100%; border-radius: 6px; cursor: pointer; font-size: 11px; text-transform: uppercase; font-weight: 700; }
        .abuse-btn { background: #1a1a1a; color: #3498db; border: 1px solid #1e3a5f; padding: 10px; width: 100%; border-radius: 6px; cursor: pointer; font-size: 11px; text-transform: uppercase; font-weight: 700; margin-top: 5px; }
    </style>
</head>
<body>

    <div class="forced-timer-container">
        <div id="forcedProgressBar"></div>
    </div>

    <div class="app-container" id="app">
        <div id="mainStage" class="stage-centered">
            <div style="width: 100%; display: flex; flex-direction: column; align-items: center;">
                <div class="label" id="stageRoleLabel">Current Role</div>
                <div class="reel-container mask-vertical">
                    <div id="roleReel" class="reel-strip text-role">
                        <div class="reel-item">?</div>
                    </div>
                </div>
            </div>

            <div id="wordSection" class="hidden-section">
                <div class="label">Word Count</div>
                <div class="reel-container mask-vertical">
                    <div id="wordReel" class="reel-strip text-word">
                        <div class="reel-item">0</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="controls">
            <div class="roll-btn-wrapper">
                <div id="rollBadge" class="roll-count-badge">0</div>
                <button id="rollBtn" class="roll-btn">Roll</button>
            </div>
            
            <div class="countdown-container">
                <div><div class="timer-label">Next Forced Reroll</div><div id="forcedTimerText" class="next-roll-timer">--:--</div></div>
            </div>
            
            <div style="display: flex; gap: 16px; margin-top: 5px;">
                <button class="icon-btn" onclick="togglePanel('inventoryPanel')">
                    <i data-lucide="package"></i>
                </button>
                <button id="autoRollToggle" class="icon-btn" onclick="toggleAutoRoll()">
                    <i data-lucide="refresh-cw"></i>
                </button>
                <button class="icon-btn" onclick="togglePanel('adminPanel')">
                    <i data-lucide="shield-alert"></i>
                </button>
            </div>
        </div>
    </div>

    <div id="inventoryPanel" class="panel">
        <div class="panel-header">
            <h2 style="margin:0; font-weight: 900;">INVENTORY</h2>
            <button style="background:none; border:none; color:#fff; cursor:pointer;" onclick="togglePanel('inventoryPanel')">
                <i data-lucide="x"></i>
            </button>
        </div>
        <div id="inventoryGrid" class="inventory-grid"></div>
    </div>

    <div id="adminPanel" class="panel">
        <div class="panel-header">
            <h2 style="margin:0; font-weight: 900; color: #e74c3c;">ADMIN</h2>
            <button style="background:none; border:none; color:#fff; cursor:pointer;" onclick="togglePanel('adminPanel')">
                <i data-lucide="x"></i>
            </button>
        </div>
        <button class="abuse-btn" onclick="startRoll(true)">Force Reroll Now</button>
        <button class="danger-btn" style="margin-top:20px;" onclick="clearInventory()">Wipe Data</button>
    </div>

    <script>
        const ROLES = [
            { id: 'stealer', name: "Stealer", min: 0, max: 50, weight: 23.8, class: "" },
            { id: 'peasant', name: "Peasant", min: 0, max: 100, weight: 25, class: "role-peasant" },
            { id: 'norole', name: "No Role", min: 0, max: 500, weight: 20, class: "" },
            { id: 'gifted', name: "Gifted", min: 100, max: 1000, weight: 15, class: "role-gifted" },
            { id: 'rich', name: "Rich", min: 1000, max: 5000, weight: 10, class: "role-rich" },
            { id: 'wealthy', name: "Wealthy", min: 10000, max: 50000, weight: 5, class: "role-wealthy" },
            { id: 'king', name: "King", min: 100000, max: 1000000, weight: 1, class: "role-king" },
            { id: 'history', name: "History", min: 999999999, max: 999999999, weight: 0.2, class: "role-history" }
        ];

        // Specific Schedule Strings
        const SCHEDULE_STRS = ["07:40", "08:21", "09:07", "09:53", "10:39", "11:25", "12:11", "12:57", "13:43", "14:29"];
        const STANDBY_INTERVAL = 45 * 60 * 1000;
        const REGEN_TIME = 30 * 60 * 1000;
        const MAX_ROLLS = 3;

        let state = {
            inventory: {},
            rolls: MAX_ROLLS,
            lastRegen: Date.now(),
            lastForcedReroll: Date.now(),
            isRolling: false,
            isAutoRolling: false,
            currentRole: null,
            currentWords: null
        };

        // Forces time to Eastern Standard Time regardless of local clock
        function getTrueEST() {
            const now = new Date();
            const utc = now.getTime() + (now.getTimezoneOffset() * 60000);
            return new Date(utc - (4 * 3600000)); // EDT (UTC-4) for current date
        }

        function getNextForcedTime() {
            const est = getTrueEST();
            const year = est.getFullYear();
            const month = est.getMonth();
            const day = est.getDate();

            // Check the schedule list
            const times = SCHEDULE_STRS.map(s => {
                const [h, m] = s.split(':').map(Number);
                return new Date(year, month, day, h, m, 0).getTime();
            });

            const nextScheduled = times.find(t => t > est.getTime());

            if (nextScheduled) {
                return { type: 'scheduled', time: nextScheduled };
            } else {
                // If after 2:29 PM, use 45m interval from last reroll
                return { type: 'interval', time: state.lastForcedReroll + STANDBY_INTERVAL };
            }
        }

        async function startRoll(isFree = false) {
            if (state.isRolling) return;
            if (!isFree && state.rolls <= 0) {
                if(state.isAutoRolling) toggleAutoRoll();
                return;
            }

            state.isRolling = true;
            if (!isFree) state.rolls--;
            
            document.getElementById('rollBtn').disabled = true;
            document.getElementById('wordSection').classList.add('hidden-section');
            document.getElementById('mainStage').classList.add('stage-centered');
            document.getElementById('stageRoleLabel').textContent = isFree ? "FORCED REROLL" : "Current Role";

            const result = generateResult();
            const finalWords = result.words.toLocaleString();

            await animateReel(document.getElementById('roleReel'), result.role.name, false, result.role);
            document.getElementById('mainStage').classList.remove('stage-centered');
            await new Promise(r => setTimeout(r, 200));
            document.getElementById('wordSection').classList.remove('hidden-section');
            await animateReel(document.getElementById('wordReel'), finalWords, true, result.role);

            state.currentRole = result.role;
            state.currentWords = finalWords;
            updateInventory(result.role.id, result.words);
            
            if (isFree) state.lastForcedReroll = Date.now();

            save();
            state.isRolling = false;
            document.getElementById('rollBtn').disabled = false;

            if(state.isAutoRolling && !isFree) setTimeout(startRoll, 400);
        }

        function generateResult() {
            const weights = ROLES.map(r => r.weight);
            const totalWeight = weights.reduce((s, w) => s + w, 0);
            let rValue = Math.random() * totalWeight;
            for (let i = 0; i < ROLES.length; i++) {
                if (rValue < weights[i]) {
                    const role = ROLES[i];
                    const words = Math.floor(Math.random() * (role.max - role.min + 1)) + role.min;
                    return { role, words };
                }
                rValue -= weights[i];
            }
        }

        function animateReel(el, finalValue, isWords, roleContext = null) {
            const count = 30;
            const duration = 1.8;
            let items = [];
            for (let i = 0; i < count - 1; i++) {
                if (isWords) {
                    const fakeVal = Math.floor(Math.random() * (roleContext.max - roleContext.min + 1)) + roleContext.min;
                    items.push(fakeVal.toLocaleString());
                } else {
                    const r = ROLES[Math.floor(Math.random() * ROLES.length)];
                    items.push(`<span class="${r.class}">${r.name}</span>`);
                }
            }
            items.push(isWords ? finalValue : `<span class="${roleContext.class}">${finalValue}</span>`);
            el.style.transition = 'none';
            el.style.transform = 'translateY(0px)';
            el.innerHTML = items.map(item => `<div class="reel-item">${item}</div>`).join('');
            el.offsetHeight; 
            el.style.transition = `transform ${duration}s cubic-bezier(0.1, 0, 0.1, 1)`;
            el.style.transform = `translateY(-${(count - 1) * 120}px)`;
            return new Promise(r => setTimeout(r, (duration * 1000) + 100));
        }

        function updateTick() {
            const now = Date.now();
            const est = getTrueEST();

            // Manual Regen
            if (state.rolls < MAX_ROLLS) {
                const elapsed = now - state.lastRegen;
                if (elapsed >= REGEN_TIME) {
                    state.rolls = Math.min(MAX_ROLLS, state.rolls + Math.floor(elapsed / REGEN_TIME));
                    state.lastRegen = now - (elapsed % REGEN_TIME);
                }
            }

            // Forced Reroll Check
            const next = getNextForcedTime();
            const diff = next.time - est.getTime();

            if (diff <= 0 && !state.isRolling) {
                startRoll(true);
            }

            // Progress Bar
            let pct = 0;
            if (next.type === 'scheduled') {
                const year = est.getFullYear();
                const month = est.getMonth();
                const day = est.getDate();
                const times = SCHEDULE_STRS.map(s => {
                    const [h, m] = s.split(':').map(Number);
                    return new Date(year, month, day, h, m, 0).getTime();
                });
                const prevTime = [...times].reverse().find(t => t < next.time) || (next.time - 45 * 60000);
                pct = ((est.getTime() - prevTime) / (next.time - prevTime)) * 100;
            } else {
                pct = ((STANDBY_INTERVAL - diff) / STANDBY_INTERVAL) * 100;
            }

            document.getElementById('forcedProgressBar').style.width = Math.min(100, Math.max(0, pct)) + '%';
            document.getElementById('forcedTimerText').textContent = diff > 0 
                ? `${Math.floor(diff/60000)}:${Math.floor((diff%60000)/1000).toString().padStart(2,'0')}`
                : "0:00";

            document.getElementById('rollBadge').textContent = state.rolls;
            requestAnimationFrame(updateTick);
        }

        function updateInventory(roleId, words) {
            if(!state.inventory[roleId]) state.inventory[roleId] = { count: 0, maxWords: 0 };
            state.inventory[roleId].count++;
            if(words > state.inventory[roleId].maxWords) state.inventory[roleId].maxWords = words;
        }

        function togglePanel(id) {
            const p = document.getElementById(id);
            p.style.display = p.style.display === 'block' ? 'none' : 'block';
            if(p.style.display === 'block' && id === 'inventoryPanel') renderInventory();
        }

        function toggleAutoRoll() {
            state.isAutoRolling = !state.isAutoRolling;
            document.getElementById('autoRollToggle').classList.toggle('auto-active', state.isAutoRolling);
            if(state.isAutoRolling && !state.isRolling) startRoll();
        }

        function renderInventory() {
            const grid = document.getElementById('inventoryGrid');
            grid.innerHTML = ROLES.map(r => {
                const data = state.inventory[r.id] || { count: 0, maxWords: 0 };
                const color = getComputedStyle(document.documentElement).getPropertyValue(`--${r.id}-color`) || '#444';
                return `<div class="inv-card">
                    <div style="font-weight: 900; font-size: 11px; color: ${color}">${r.name}</div>
                    <div style="font-size: 10px; opacity: 0.4;">Rolls: ${data.count}</div>
                    <div style="font-size: 10px; opacity: 0.4;">Max: ${data.maxWords.toLocaleString()}</div>
                </div>`;
            }).join('');
        }

        function save() { localStorage.setItem('roleRNG_v11_exact', JSON.stringify(state)); }
        function clearInventory() { localStorage.removeItem('roleRNG_v11_exact'); location.reload(); }

        window.onload = () => {
            const saved = localStorage.getItem('roleRNG_v11_exact');
            if(saved) state = {...state, ...JSON.parse(saved), isRolling: false, isAutoRolling: false};
            lucide.createIcons();
            updateTick();
        };

        document.getElementById('rollBtn').onclick = () => startRoll();
    </script>
</body>
</html>
