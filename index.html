<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Role RNG Elite - Active Catchup</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&display=swap');
        
        :root {
            --stealer-color: #555;
            --peasant-color: #a52a2a;
            --gifted-color: #3498db;
            --rich-color: #f1c40f;
            --wealthy-color: #e67e22;
            --king-color: #e74c3c;
            --history-color: #fff;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            background-color: #000;
            color: #fff;
            font-family: 'Inter', sans-serif;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .app-container {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            min-height: 100vh;
        }

        .forced-timer-container {
            width: 100%;
            height: 4px;
            background: #111;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 50;
        }
        #forcedProgressBar {
            height: 100%;
            width: 0%;
            background: #f1c40f;
            transition: width 0.5s linear;
        }

        #mainStage {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            margin-bottom: 20px;
        }
        .stage-centered { transform: translateY(60px); }
        
        .mask-vertical {
            mask-image: linear-gradient(to bottom, transparent, black 30%, black 70%, transparent);
            -webkit-mask-image: linear-gradient(to bottom, transparent, black 30%, black 70%, transparent);
        }
        .reel-container { height: 120px; width: 100%; position: relative; overflow: hidden; }
        .reel-strip { position: absolute; width: 100%; left: 0; top: 0; display: flex; flex-direction: column; }
        .reel-item { height: 120px; display: flex; align-items: center; justify-content: center; text-align: center; flex-shrink: 0; }

        .label { font-size: 10px; letter-spacing: 4px; text-transform: uppercase; opacity: 0.3; margin-bottom: 8px; }
        .text-role { font-size: clamp(2.5rem, 8vw, 4rem); font-weight: 900; letter-spacing: -2px; text-transform: uppercase; }
        .text-word { font-size: clamp(1.5rem, 6vw, 3rem); font-weight: 300; white-space: nowrap; width: 100%; overflow: hidden; text-overflow: ellipsis; }
        
        .role-peasant { color: var(--peasant-color); }
        .role-gifted { color: var(--gifted-color); }
        .role-rich { color: var(--rich-color); }
        .role-wealthy { color: var(--wealthy-color); }
        .role-king { color: var(--king-color); text-shadow: 0 0 20px rgba(231, 76, 60, 0.5); }
        .role-history { color: var(--history-color); text-shadow: 0 0 20px #fff; animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }

        .panel { position: fixed; top: 0; right: 0; bottom: 0; left: 0; background: #000; z-index: 100; padding: 40px 24px; display: none; overflow-y: auto; }
        .panel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid #222; padding-bottom: 10px; }
        
        .controls { display: flex; flex-direction: column; align-items: center; gap: 10px; width: 100%; }
        
        .roll-btn-wrapper { position: relative; }
        .roll-count-badge { 
            position: absolute; 
            top: -8px; 
            right: -12px; 
            background: #e74c3c; 
            color: #fff; 
            font-size: 11px; 
            font-weight: 900; 
            padding: 4px 8px; 
            border-radius: 20px; 
            border: 2px solid #000;
            z-index: 5;
        }

        .roll-btn { background: #fff; color: #000; border: none; padding: 18px 60px; font-weight: 900; letter-spacing: 4px; text-transform: uppercase; cursor: pointer; transition: 0.2s; border-radius: 4px; position: relative; }
        .roll-btn:disabled { opacity: 0.3; cursor: not-allowed; }
        .roll-btn.auto-active { background: #e74c3c; color: #fff; }
        
        .icon-btn { background: #111; border: 1px solid #222; color: #fff; width: 56px; height: 56px; border-radius: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
        
        .admin-row { background: #111; padding: 15px; margin-bottom: 10px; border-radius: 8px; border: 1px solid #222; }
        .admin-row h4 { margin: 0 0 12px 0; font-size: 11px; text-transform: uppercase; color: #888; letter-spacing: 1px; }
        .admin-input-group { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 8px; }
        input, select { background: #000; color: #fff; border: 1px solid #333; padding: 10px; width: 100%; margin-bottom: 8px; border-radius: 6px; font-family: inherit; font-size: 13px; }
        
        .toggle-btn { background: #111; border: 1px solid #333; color: #666; padding: 8px 12px; font-size: 11px; cursor: pointer; border-radius: 6px; text-align: center; }
        .toggle-active { background: #fff; color: #000; border-color: #fff; font-weight: 700; }

        .inventory-grid { display: flex; flex-direction: column; gap: 8px; }
        .inv-card { background: #0a0a0a; padding: 12px; border-radius: 8px; border: 1px solid #1a1a1a; display: flex; justify-content: space-between; align-items: center; }

        .countdown-container { display: flex; flex-direction: column; align-items: center; gap: 5px; min-height: 50px; }
        .timer-label { font-size: 9px; color: #444; text-transform: uppercase; margin-bottom: 2px; }
        .next-roll-timer { font-size: 10px; color: #666; }
        
        .danger-btn { background: #2a1111; color: #e74c3c; border: 1px solid #451a1a; padding: 10px; width: 100%; border-radius: 6px; cursor: pointer; font-size: 11px; text-transform: uppercase; font-weight: 700; }
        .abuse-btn { background: #1a1a1a; color: #3498db; border: 1px solid #1e3a5f; padding: 10px; width: 100%; border-radius: 6px; cursor: pointer; font-size: 11px; text-transform: uppercase; font-weight: 700; margin-top: 5px; }
        
        .buff-badge { font-size: 9px; padding: 2px 6px; border-radius: 4px; background: #222; color: #888; font-weight: 700; }
        .buff-active { color: #3498db; background: rgba(52, 152, 219, 0.1); }

        .catchup-msg { position: fixed; top: 10px; left: 50%; transform: translateX(-50%); background: #f1c40f; color: #000; font-size: 11px; font-weight: 900; padding: 4px 12px; border-radius: 20px; z-index: 100; animation: slideDown 0.5s forwards; }
        @keyframes slideDown { from { top: -30px; } to { top: 10px; } }
    </style>
</head>
<body>

    <div id="catchupAlert" style="display:none;" class="catchup-msg">CATCHING UP...</div>

    <div class="forced-timer-container">
        <div id="forcedProgressBar"></div>
    </div>

    <div class="app-container">
        <div id="mainStage" class="stage-centered">
            <div style="width: 100%; display: flex; flex-direction: column; align-items: center;">
                <div class="label" id="stageRoleLabel">Current Role</div>
                <div class="reel-container mask-vertical">
                    <div id="roleReel" class="reel-strip text-role">
                        <div class="reel-item">?</div>
                    </div>
                </div>
            </div>

            <div id="wordSection" style="opacity: 0; pointer-events: none;">
                <div class="label">Word Count</div>
                <div class="reel-container mask-vertical">
                    <div id="wordReel" class="reel-strip text-word">
                        <div class="reel-item">0</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="controls">
            <div class="roll-btn-wrapper">
                <div id="rollBadge" class="roll-count-badge">0</div>
                <button id="rollBtn" class="roll-btn">Roll</button>
            </div>
            
            <div class="countdown-container">
                <div id="buffIndicators" style="display: flex; gap: 8px; margin-bottom: 4px;"></div>
                <div><div class="timer-label">Regen</div><div id="regenTimer" class="next-roll-timer">FULL</div></div>
                <div><div class="timer-label">Next Forced Reroll</div><div id="forcedTimerText" class="next-roll-timer">--:--</div></div>
            </div>
            
            <div style="display: flex; gap: 16px; margin-top: 5px;">
                <button class="icon-btn" onclick="togglePanel('inventoryPanel')">
                    <i data-lucide="package"></i>
                </button>
                <button id="autoRollToggle" class="icon-btn" onclick="toggleAutoRoll()">
                    <i data-lucide="refresh-cw"></i>
                </button>
                <button class="icon-btn" onclick="togglePanel('adminPanel')">
                    <i data-lucide="shield-alert"></i>
                </button>
            </div>
        </div>
    </div>

    <div id="inventoryPanel" class="panel">
        <div class="panel-header">
            <h2 style="margin:0; font-weight: 900;">INVENTORY</h2>
            <button style="background:none; border:none; color:#fff;" onclick="togglePanel('inventoryPanel')"><i data-lucide="x"></i></button>
        </div>
        <div id="inventoryGrid" class="inventory-grid"></div>
    </div>

    <div id="adminPanel" class="panel">
        <div class="panel-header">
            <h2 style="margin:0; font-weight: 900; color: #e74c3c;">ADMIN Master</h2>
            <button style="background:none; border:none; color:#fff;" onclick="togglePanel('adminPanel')"><i data-lucide="x"></i></button>
        </div>
        
        <div class="admin-row">
            <h4>Luck Multiplier</h4>
            <div class="admin-input-group">
                <input type="number" id="luckInput" value="100">
                <input type="number" id="luckDuration" value="120">
            </div>
            <button class="abuse-btn" onclick="applyLuck()">Set Luck</button>
        </div>

        <div class="admin-row">
            <h4>Roll Speed</h4>
            <div class="admin-input-group">
                <input type="number" id="speedInput" step="0.1" value="0.2">
                <input type="number" id="speedDuration" value="120">
            </div>
            <button class="abuse-btn" onclick="applySpeed()">Set Speed</button>
        </div>

        <div class="admin-row">
            <h4>Give Rolls</h4>
            <input type="number" id="grantInput" value="50">
            <button class="abuse-btn" onclick="grantRolls()">Grant</button>
        </div>

        <div class="admin-row">
            <h4>Controls</h4>
            <button class="abuse-btn" onclick="startRoll(true)">Force Reroll Now</button>
            <button id="infRollBtn" class="toggle-btn" style="width:100%; margin-top:8px;" onclick="toggleInfinite()">Infinite: OFF</button>
        </div>

        <div class="admin-row">
            <button class="danger-btn" onclick="localStorage.clear(); location.reload();">Clear All Data</button>
        </div>
    </div>

    <script>
        const ROLES = [
            { id: 'stealer', name: "Stealer", min: 0, max: 50, weight: 23.8, class: "" },
            { id: 'peasant', name: "Peasant", min: 0, max: 100, weight: 25, class: "role-peasant" },
            { id: 'norole', name: "No Role", min: 0, max: 500, weight: 20, class: "" },
            { id: 'gifted', name: "Gifted", min: 100, max: 1000, weight: 15, class: "role-gifted" },
            { id: 'rich', name: "Rich", min: 1000, max: 5000, weight: 10, class: "role-rich" },
            { id: 'wealthy', name: "Wealthy", min: 10000, max: 50000, weight: 5, class: "role-wealthy" },
            { id: 'king', name: "King", min: 100000, max: 1000000, weight: 1, class: "role-king" },
            { id: 'history', name: "History", min: 999999999, max: 999999999, weight: 0.2, class: "role-history" }
        ];

        const SCHEDULE = ["07:40", "08:21", "09:07", "09:53", "10:39", "11:25", "12:11", "12:57", "13:43", "14:29"];
        const STANDBY_INTERVAL = 45 * 60 * 1000;
        const REGEN_TIME = 30 * 60 * 1000;
        const MAX_ROLLS = 3;

        let state = {
            inventory: {},
            rolls: MAX_ROLLS,
            lastRegen: Date.now(),
            lastForcedTimestamp: 0, 
            infiniteRolls: false,
            luck: 1, luckExpiry: 0,
            rollSpeed: 1.8, speedExpiry: 0,
            riggedId: null,
            isRolling: false,
            isAutoRolling: false,
            currentRole: null, currentWords: null
        };

        function getEST() {
            const now = new Date();
            const utc = now.getTime() + (now.getTimezoneOffset() * 60000);
            return new Date(utc - (4 * 3600000));
        }

        function getNextForcedTime() {
            const est = getEST();
            const year = est.getFullYear(), month = est.getMonth(), day = est.getDate();
            const times = SCHEDULE.map(s => {
                const [h, m] = s.split(':').map(Number);
                return new Date(year, month, day, h, m, 0).getTime();
            });
            const nextScheduled = times.find(t => t > est.getTime());
            if (nextScheduled) return { type: 'scheduled', time: nextScheduled };
            
            const lastScheduled = times[times.length - 1];
            let nextInt = lastScheduled + STANDBY_INTERVAL;
            while(nextInt < est.getTime()) nextInt += STANDBY_INTERVAL;
            return { type: 'interval', time: nextInt };
        }

        async function catchUpCheck() {
            const est = getEST().getTime();
            const last = state.lastForcedTimestamp;
            if (last === 0) {
                state.lastForcedTimestamp = est;
                save();
                return;
            }

            let missedCount = 0;
            const year = new Date(last).getFullYear(), month = new Date(last).getMonth(), day = new Date(last).getDate();
            
            SCHEDULE.forEach(s => {
                const [h, m] = s.split(':').map(Number);
                const t = new Date(year, month, day, h, m, 0).getTime();
                if (t > last && t <= est) missedCount++;
            });

            const lastSched = new Date(year, month, day, 14, 29, 0).getTime();
            if (est > lastSched) {
                const startPoint = Math.max(last, lastSched);
                missedCount += Math.floor((est - startPoint) / STANDBY_INTERVAL);
            }

            if (missedCount > 0) {
                document.getElementById('catchupAlert').style.display = 'block';
                document.getElementById('catchupAlert').textContent = `CATCHING UP: ${missedCount} ROLLS...`;
                for(let i=0; i < missedCount; i++) {
                    await startRoll(true);
                }
                document.getElementById('catchupAlert').style.display = 'none';
            }
        }

        async function startRoll(isFree = false) {
            if (state.isRolling) return;
            if (!isFree && !state.infiniteRolls && state.rolls <= 0) return toggleAutoRoll();

            state.isRolling = true;
            if (!isFree && !state.infiniteRolls) state.rolls--;
            
            document.getElementById('rollBtn').disabled = true;
            document.getElementById('wordSection').style.opacity = '0';
            document.getElementById('mainStage').classList.add('stage-centered');
            document.getElementById('stageRoleLabel').textContent = isFree ? "FORCED REROLL" : "Current Role";

            let resRole;
            const currentLuck = Date.now() < state.luckExpiry ? state.luck : 1;
            const weighted = ROLES.map(r => ({ ...r, ew: r.weight * (r.weight < 15 ? currentLuck : 1) }));
            const total = weighted.reduce((s, r) => s + r.ew, 0);
            let rv = Math.random() * total;
            for (let r of weighted) { if (rv < r.ew) { resRole = r; break; } rv -= r.ew; }

            const wordsValue = Math.floor(Math.random() * (resRole.max - resRole.min + 1)) + resRole.min;
            await animateReel(document.getElementById('roleReel'), resRole.name, false, resRole);
            document.getElementById('mainStage').classList.remove('stage-centered');
            await new Promise(r => setTimeout(r, 200));
            document.getElementById('wordSection').style.opacity = '1';
            await animateReel(document.getElementById('wordReel'), wordsValue.toLocaleString(), true, resRole);

            state.currentRole = resRole;
            state.currentWords = wordsValue.toLocaleString();
            if(!state.inventory[resRole.id]) state.inventory[resRole.id] = { count: 0, maxWords: 0 };
            state.inventory[resRole.id].count++;
            if(wordsValue > state.inventory[resRole.id].maxWords) state.inventory[resRole.id].maxWords = wordsValue;
            
            if (isFree) state.lastForcedTimestamp = getEST().getTime();
            save();
            state.isRolling = false;
            document.getElementById('rollBtn').disabled = false;
            if(state.isAutoRolling && !isFree) setTimeout(startRoll, 400);
        }

        function animateReel(el, val, isWords, role) {
            const speed = Date.now() < state.speedExpiry ? state.rollSpeed : 1.8;
            const count = 30;
            let html = '';
            for(let i=0; i<count-1; i++) {
                if(isWords) html += `<div class="reel-item">${Math.floor(Math.random()*role.max).toLocaleString()}</div>`;
                else { const r = ROLES[Math.floor(Math.random()*ROLES.length)]; html += `<div class="reel-item"><span class="${r.class}">${r.name}</span></div>`; }
            }
            html += `<div class="reel-item"><span class="${isWords ? '' : role.class}">${val}</span></div>`;
            el.style.transition = 'none';
            el.style.transform = 'translateY(0)';
            el.innerHTML = html;
            el.offsetHeight;
            el.style.transition = `transform ${speed}s cubic-bezier(0.1, 0, 0.1, 1)`;
            el.style.transform = `translateY(-${(count-1)*120}px)`;
            return new Promise(r => setTimeout(r, speed*1000 + 100));
        }

        function updateTick() {
            const now = Date.now(), est = getEST();
            
            if (state.rolls < MAX_ROLLS) {
                const elapsed = now - state.lastRegen;
                if (elapsed >= REGEN_TIME) {
                    state.rolls = Math.min(MAX_ROLLS, state.rolls + Math.floor(elapsed/REGEN_TIME));
                    state.lastRegen = now - (elapsed % REGEN_TIME);
                }
                const rem = REGEN_TIME - (now - state.lastRegen);
                document.getElementById('regenTimer').textContent = `${Math.floor(rem/60000)}:${Math.floor((rem%60000)/1000).toString().padStart(2,'0')}`;
            } else {
                document.getElementById('regenTimer').textContent = "FULL";
                state.lastRegen = now;
            }

            const next = getNextForcedTime();
            const diff = next.time - est.getTime();
            if (diff <= 0 && !state.isRolling) {
                startRoll(true);
            }

            let buffs = '';
            if (now < state.luckExpiry) buffs += `<div class="buff-badge buff-active">Luck ${state.luck}x (${Math.floor((state.luckExpiry-now)/1000)}s)</div>`;
            if (now < state.speedExpiry) buffs += `<div class="buff-badge buff-active">Speed ${state.rollSpeed}s (${Math.floor((state.speedExpiry-now)/1000)}s)</div>`;
            document.getElementById('buffIndicators').innerHTML = buffs;

            const nextPct = next.type === 'scheduled' ? ((est.getTime() - (next.time - 45*60000))/(45*60000))*100 : ((STANDBY_INTERVAL-diff)/STANDBY_INTERVAL)*100;
            document.getElementById('forcedProgressBar').style.width = Math.min(100, Math.max(0, nextPct)) + '%';
            document.getElementById('forcedTimerText').textContent = diff > 0 ? `${Math.floor(diff/60000)}:${Math.floor((diff%60000)/1000).toString().padStart(2,'0')}` : "0:00";
            document.getElementById('rollBadge').textContent = state.infiniteRolls ? '∞' : state.rolls;
            
            requestAnimationFrame(updateTick);
        }

        function applyLuck() { state.luck = parseFloat(document.getElementById('luckInput').value); state.luckExpiry = Date.now() + parseInt(document.getElementById('luckDuration').value)*1000; save(); }
        function applySpeed() { state.rollSpeed = parseFloat(document.getElementById('speedInput').value); state.speedExpiry = Date.now() + parseInt(document.getElementById('speedDuration').value)*1000; save(); }
        function grantRolls() { state.rolls += parseInt(document.getElementById('grantInput').value); save(); }
        function toggleInfinite() { state.infiniteRolls = !state.infiniteRolls; document.getElementById('infRollBtn').classList.toggle('toggle-active', state.infiniteRolls); save(); }
        
        function togglePanel(id) {
            const p = document.getElementById(id);
            const isOpen = p.style.display === 'block';
            document.querySelectorAll('.panel').forEach(x => x.style.display = 'none');
            p.style.display = isOpen ? 'none' : 'block';
            if(!isOpen && id === 'inventoryPanel') renderInventory();
        }

        function toggleAutoRoll() {
            state.isAutoRolling = !state.isAutoRolling;
            document.getElementById('autoRollToggle').classList.toggle('auto-active', state.isAutoRolling);
            if(state.isAutoRolling && !state.isRolling) startRoll();
        }

        function renderInventory() {
            document.getElementById('inventoryGrid').innerHTML = ROLES.map(r => {
                const d = state.inventory[r.id] || { count: 0, maxWords: 0 };
                return `<div class="inv-card">
                    <div><b style="color:var(--${r.id}-color, #fff)">${r.name}</b><br><span style="font-size:9px; opacity:0.5">Best: ${d.maxWords.toLocaleString()}</span></div>
                    <div style="font-weight:900">x${d.count}</div>
                </div>`;
            }).join('');
        }

        function save() { localStorage.setItem('roleRNG_v17_active', JSON.stringify(state)); }

        window.onload = () => {
            const saved = localStorage.getItem('roleRNG_v17_active');
            if(saved) {
                state = {...state, ...JSON.parse(saved), isRolling: false, isAutoRolling: false};
                if(state.currentRole) {
                    document.getElementById('roleReel').innerHTML = `<div class="reel-item"><span class="${state.currentRole.class}">${state.currentRole.name}</span></div>`;
                    document.getElementById('wordReel').innerHTML = `<div class="reel-item">${state.currentWords}</div>`;
                    document.getElementById('wordSection').style.opacity = '1';
                    document.getElementById('mainStage').classList.remove('stage-centered');
                }
            }
            catchUpCheck();
            lucide.createIcons();
            updateTick();
        };

        document.getElementById('rollBtn').onclick = () => startRoll();
    </script>
</body>
</html>
