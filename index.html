<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Role RNG System</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;800;900&display=swap');
        
        * { box-sizing: border-box; }
        body {
            background-color: #000;
            color: #fff;
            font-family: 'Inter', sans-serif;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .app-container {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            min-height: 100vh;
        }

        .mask-vertical {
            mask-image: linear-gradient(to bottom, transparent, black 30%, black 70%, transparent);
            -webkit-mask-image: linear-gradient(to bottom, transparent, black 30%, black 70%, transparent);
        }

        /* Role Colors */
        .role-peasant { color: #a52a2a; }
        .role-gifted { color: #3498db; text-shadow: 0 0 15px rgba(52, 152, 219, 0.4); }
        .role-rich { color: #f1c40f; text-shadow: 0 0 15px rgba(241, 196, 15, 0.4); }
        .role-wealthy { color: #e67e22; text-shadow: 0 0 15px rgba(230, 126, 34, 0.4); }
        .role-king { color: #e74c3c; text-shadow: 0 0 20px rgba(231, 76, 60, 0.5); }
        .role-history { 
            color: #fff; 
            text-shadow: 0 0 20px #fff, 0 0 40px #fff; 
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.7; }
            100% { opacity: 1; }
        }

        #mainStage {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            margin-bottom: 40px;
        }

        .stage-centered { transform: translateY(100px); }

        .reel-container {
            height: 120px;
            width: 100%;
            position: relative;
            overflow: hidden;
        }

        .reel-strip {
            position: absolute;
            width: 100%;
            left: 0;
            top: 0;
            display: flex;
            flex-direction: column;
        }

        .reel-item {
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            flex-shrink: 0;
        }

        .label {
            font-size: 9px;
            letter-spacing: 4px;
            text-transform: uppercase;
            opacity: 0.3;
            margin-bottom: 8px;
        }

        #wordSection {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: opacity 0.5s, transform 0.5s;
            margin-top: 20px;
        }

        .hidden-section {
            opacity: 0;
            pointer-events: none;
            transform: translateY(20px);
        }

        .controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            z-index: 10;
        }

        .roll-btn {
            background-color: #fff;
            color: #000;
            border: none;
            padding: 16px 48px;
            font-size: 14px;
            font-weight: 900;
            letter-spacing: 6px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s;
        }

        .roll-btn:hover:not(:disabled) { opacity: 0.9; }
        .roll-btn:active:not(:disabled) { transform: scale(0.95); }
        .roll-btn:disabled { opacity: 0.1; cursor: not-allowed; }

        .status-text {
            font-size: 9px;
            letter-spacing: 2px;
            text-transform: uppercase;
            opacity: 0.2;
            height: 16px;
        }

        .text-role { font-size: 3rem; font-weight: 900; letter-spacing: -2px; }
        .text-word { font-size: 2.5rem; font-weight: 300; }

        @media (min-width: 768px) {
            .text-role { font-size: 4rem; }
            .text-word { font-size: 3rem; }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div id="mainStage" class="stage-centered">
            <div style="width: 100%; display: flex; flex-direction: column; align-items: center;">
                <div class="label">Role</div>
                <div class="reel-container mask-vertical">
                    <div id="roleReel" class="reel-strip text-role">
                        <div class="reel-item">?</div>
                    </div>
                </div>
            </div>

            <div id="wordSection" class="hidden-section">
                <div class="label">Word Count</div>
                <div class="reel-container mask-vertical">
                    <div id="wordReel" class="reel-strip text-word">
                        <div class="reel-item">0</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="controls">
            <button id="rollBtn" class="roll-btn">Roll Role</button>
            <div id="statusText" class="status-text">Ready</div>
        </div>
    </div>

    <script>
        const ROLES = [
            { id: 'stealer', name: "Stealer", min: 0, max: 50, weight: 23.8, class: "" },
            { id: 'peasant', name: "Peasant", min: 0, max: 100, weight: 25, class: "role-peasant" },
            { id: 'norole', name: "No Role", min: 0, max: 500, weight: 20, class: "" },
            { id: 'gifted', name: "Gifted", min: 100, max: 1000, weight: 15, class: "role-gifted" },
            { id: 'rich', name: "Rich", min: 1000, max: 5000, weight: 10, class: "role-rich" },
            { id: 'wealthy', name: "Wealthy", min: 10000, max: 50000, weight: 5, class: "role-wealthy" },
            { id: 'king', name: "King", min: 100000, max: 1000000, weight: 1, class: "role-king" },
            { id: 'history', name: "History", min: 999999999, max: 999999999, weight: 0.2, class: "role-history" }
        ];

        const ITEM_HEIGHT = 120;
        let isRolling = false;

        const roleReel = document.getElementById('roleReel');
        const wordReel = document.getElementById('wordReel');
        const wordSection = document.getElementById('wordSection');
        const mainStage = document.getElementById('mainStage');
        const rollBtn = document.getElementById('rollBtn');
        const statusText = document.getElementById('statusText');

        function init() {
            const savedData = localStorage.getItem('roleRNG_v3');
            if (savedData) {
                const data = JSON.parse(savedData);
                const role = ROLES.find(r => r.name === data.savedRole);
                if (role) displayResult(role, data.savedWords);
            }
        }

        function displayResult(role, words) {
            roleReel.innerHTML = `<div class="reel-item ${role.class}">${role.name}</div>`;
            wordReel.innerHTML = `<div class="reel-item">${words}</div>`;
            wordSection.classList.remove('hidden-section');
            mainStage.classList.remove('stage-centered');
        }

        async function animateReel(el, finalValue, isWords, roleContext = null) {
            const count = 40;
            let items = [];
            for (let i = 0; i < count - 1; i++) {
                if (isWords) {
                    // Random numbers based on range
                    const val = Math.floor(Math.random() * (roleContext.max - roleContext.min + 1)) + roleContext.min;
                    items.push(val.toLocaleString());
                } else {
                    const r = ROLES[Math.floor(Math.random() * ROLES.length)];
                    items.push(`<span class="${r.class}">${r.name}</span>`);
                }
            }
            items.push(isWords ? finalValue : `<span class="${roleContext.class}">${finalValue}</span>`);
            el.style.transition = 'none';
            el.style.transform = 'translateY(0px)';
            el.innerHTML = items.map(item => `<div class="reel-item">${item}</div>`).join('');
            el.offsetHeight; 
            el.style.transition = 'transform 3s cubic-bezier(0.1, 0, 0.1, 1)';
            el.style.transform = `translateY(-${(count - 1) * ITEM_HEIGHT}px)`;
            return new Promise(r => setTimeout(r, 3100));
        }

        async function startRoll() {
            if (isRolling) return;
            isRolling = true;
            rollBtn.disabled = true;
            
            wordSection.classList.add('hidden-section');
            mainStage.classList.add('stage-centered');
            statusText.textContent = "Rolling Role...";

            const totalWeight = ROLES.reduce((s, r) => s + r.weight, 0);
            let rValue = Math.random() * totalWeight;
            let selectedRole = ROLES[0];
            
            for (const role of ROLES) {
                if (rValue < role.weight) {
                    selectedRole = role;
                    break;
                }
                rValue -= role.weight;
            }

            const wordVal = Math.floor(Math.random() * (selectedRole.max - selectedRole.min + 1)) + selectedRole.min;
            const finalWords = wordVal.toLocaleString();

            await animateReel(roleReel, selectedRole.name, false, selectedRole);
            mainStage.classList.remove('stage-centered');
            await new Promise(r => setTimeout(r, 600));
            wordSection.classList.remove('hidden-section');
            statusText.textContent = "Rolling Words...";
            await animateReel(wordReel, finalWords, true, selectedRole);

            localStorage.setItem('roleRNG_v3', JSON.stringify({
                savedRole: selectedRole.name,
                savedWords: finalWords
            }));

            statusText.textContent = "Roll Complete";
            isRolling = false;
            rollBtn.disabled = false;
        }

        rollBtn.addEventListener('click', startRoll);
        init();
    </script>
</body>
</html>
